
version: '3.8'



services:

  haproxy:

    image: haproxy:2.8

    container_name: perennia-perimeter

    volumes:

      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    ports:

      - "3331:3331"

      - "3332:3332"

      - "3333:3333"

    network_mode: "host"

    restart: unless-stopped
